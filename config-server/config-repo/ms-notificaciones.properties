server.port=8093
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.instance.prefer-ip-address=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWKS:http://localhost:9000/oauth2/jwks}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
resilience4j.circuitbreaker.instances.backend.sliding-window-size=10
resilience4j.circuitbreaker.instances.backend.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backend.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=10
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.clientes.sliding-window-size=10
resilience4j.circuitbreaker.instances.clientes.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.clientes.wait-duration-in-open-state=10s
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_eft}?currentSchema=auditoria
spring.datasource.username=${DB_USER:banco}
spring.datasource.password=${DB_PASSWORD:eft-demo-2026}
spring.datasource.hikari.maximum-pool-size=6
spring.sql.init.mode=never
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
resilience4j.circuitbreaker.instances.backend.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.circuitbreaker.instances.clientes.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
