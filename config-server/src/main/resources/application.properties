spring.application.name=config-server
server.port=8888

# Perfil native, lee las configuraciones desde una carpeta local
# (config-repo/), en vez de un repositorio Git remoto.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:./config-repo

# ---------- Autenticacion basica ----------
# banco-servicios debe usar estas mismas credenciales en su
# bootstrap.properties (spring.cloud.config.username/password).
spring.security.user.name=admin
spring.security.user.password=admin
