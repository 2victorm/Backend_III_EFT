spring.application.name=auth-server
server.port=9000
spring.security.oauth2.authorizationserver.issuer=${OAUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.authorizationserver.client.web.registration.client-id=web
spring.security.oauth2.authorizationserver.client.web.registration.client-secret={noop}${WEB_SECRET:web-demo-2026}
spring.security.oauth2.authorizationserver.client.web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.web.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.web.registration.scopes=banco.read,banco.write,canal.web
spring.security.oauth2.authorizationserver.client.web.token.access-token-time-to-live=30m
